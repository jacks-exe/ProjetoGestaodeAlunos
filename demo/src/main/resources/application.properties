# =============================================================
# Sistema de Gestão de Alunos - Configuração
# =============================================================
spring.application.name=sistema-alunos
server.port=8080

# ---------- Banco de dados (MySQL) ----------
# Valores podem ser sobrescritos por variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sistema_alunos?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# O schema é criado pelo database/script.sql; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# ---------- JWT ----------
# Segredo em Base64 (mínimo 256 bits). Em produção, defina JWT_SECRET no ambiente.
app.jwt.secret=${JWT_SECRET:M3fM0R/941FGQD1IKRHXDtbAIiMWaZobA+ZZSZbY9pZU0iOYpPftlf5KNRu05c09}
# Validade do token em milissegundos (2 horas)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# ---------- CORS ----------
# Origem do frontend Vue (Vite). Pode ser sobrescrita por variável de ambiente.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- Erros ----------
# Evita vazar stack trace e detalhes internos nas respostas HTTP.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never